name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Entrar a la carpeta del proyecto
            cd /opt/Personal_Website
            
            # 2. Descargar el código nuevo
            git pull origin main
            
            # 3. Activar el entorno virtual e instalar si hay dependencias nuevas
            source venv/bin/activate
            pip install -r requirements.txt
            
            # 4. Reiniciar el servicio de la web para aplicar los cambios
            sudo systemctl restart miweb.service