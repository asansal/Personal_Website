  <path d="M432 232 H592 L780 792 H640 L512 411 L384 792 H244 Z" fill="#FFFFFF"/>
  <!-- Data-point dot replacing the crossbar -->
  <circle cx="512" cy="670" r="46" fill="#C9B6E4"/>
</svg>
